<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img" aria-label="Mathematics">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#21a1a8"/>
      <stop offset="1" stop-color="#0e6f7a"/>
    </linearGradient>
  </defs>
  <rect width="400" height="240" fill="url(#bg)"/>
  <g font-family="Georgia, 'Times New Roman', serif" font-weight="bold"
     fill="#ffffff" fill-opacity="0.18" font-size="88">
    <text x="24" y="204">y = mx + b</text>
    <text x="148" y="92">x²</text>
    <text x="296" y="204">π</text>
  </g>
  <g fill="#ffffff">
