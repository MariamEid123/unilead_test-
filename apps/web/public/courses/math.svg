    <text x="318" y="54" font-family="Georgia, serif" font-size="28">(x)</text>
    <text x="358" y="46" font-family="Arial, sans-serif" font-size="34"> = 0</text>
  </g>
  <g stroke="#ffffff" stroke-opacity="0.55" stroke-width="4" stroke-linecap="round">
    <line x1="52" y1="172" x2="360" y2="52"/>
